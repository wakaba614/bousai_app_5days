<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-title" href="{{ url_for('index') }}">防災アプリ</a>
      <button class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="site-navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <nav id="site-navigation" class="site-navigation" aria-label="メインメニュー">
    <a href="{{ url_for('index') }}">ホーム</a>
    <a href="{{ url_for('shelter_search') }}">避難所検索</a>
    <a href="{{ url_for('shelter_register') }}">避難所登録</a>
    <a href="{{ url_for('board') }}">指示・発信ボード</a>
    {% if session.logged_in %}
      ログイン中{% if session.username %}（{{ session.username }}）{% endif %}
      <a href="{{ url_for('logout') }}">ログアウト</a>
    {% else %}
      未ログイン
      <a href="{{ url_for('login') }}">ログイン</a>
    {% endif %}
  </nav>

  <main class="page-content">
    {% block content %}{% endblock %}
  </main>

  <script>
    const menuButton = document.querySelector('.menu-button');
    const navigation = document.querySelector('.site-navigation');
    menuButton.addEventListener('click', () => {
      const isOpen = navigation.classList.toggle('is-open');
      menuButton.setAttribute('aria-expanded', String(isOpen));
    });
  </script>
</body>
</html>
