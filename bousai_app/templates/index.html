{% extends "base.html" %}

{% block content %}
<section class="home-menu" aria-labelledby="home-menu-title">
    <h1 id="home-menu-title" class="section-title">防災情報</h1>
    <div class="home-menu-grid">
        <section class="home-menu-card weather-menu-card" aria-labelledby="weather-title">
            <h2 id="weather-title" class="home-menu-card-title"><span class="home-menu-icon" aria-hidden="true">☁</span>気象警報・注意報</h2>
            <p class="refresh-label"><span aria-hidden="true">↻</span> 10分おき自動更新</p>
            <div id="weatherContent" class="weather-content">
                <p class="loading-message">気象情報を読み込み中...</p>
            </div>
        </section>
        <a class="home-menu-card" href="{{ url_for('board') }}">
            <span class="home-menu-icon" aria-hidden="true">!</span>
            <span>避難指示</span>
        </a>
        <a class="home-menu-card" href="{{ url_for('feature_page', feature_name='language') }}">
            <span class="home-menu-icon" aria-hidden="true">文</span>
            <span>言語設定</span>
        </a>
        <a class="home-menu-card" href="{{ url_for('feature_page', feature_name='notifications') }}">
            <span class="home-menu-icon" aria-hidden="true">通知</span>
            <span>通知設定</span>
        </a>
        <a class="home-menu-card" href="{{ url_for('feature_page', feature_name='guide') }}">
            <span class="home-menu-icon" aria-hidden="true">?</span>
            <span>防災ガイド</span>
        </a>
        <a class="home-menu-card" href="{{ url_for('login') }}">
            <span class="home-menu-icon" aria-hidden="true">鍵</span>
            <span>管理者ログイン</span>
        </a>
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 気象警報・注意報の自動更新機能
    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p class="error-message">気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul class="warning-list">';
            data.warnings.forEach(warning => {
                warningsHtml += `<li>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = '<p class="no-warning"><span aria-hidden="true">●</span> 現在、警報・注意報は発表されていません</p>';
        }

        weatherContent.innerHTML = `
            <p class="weather-area"><span aria-hidden="true">●</span> ${data.area_name || '青森市'}</p>
            ${warningsHtml}
            <p class="weather-time"><span aria-hidden="true">◷</span> データ取得: <span id="lastFetchTime">${data.last_fetch_time || '更新中...'}</span></p>
            <p class="weather-time"><span aria-hidden="true">◒</span> 気象庁発表: ${data.report_time || '不明'}</p>
        `;
    }

    // 初回表示＋10分（600,000ミリ秒）おきに自動更新
    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
